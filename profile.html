<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>マイページ | ハモボード</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav-root"></div>

  <div class="page">
    <div class="page-head">
      <div class="eyebrow">My Page</div>
      <h1 class="page-title">プロフィール編集</h1>
      <p class="page-sub">ここで登録した内容が「メンバー自己紹介」に表示されます。</p>
    </div>

    <div class="card" style="max-width:520px;">
      <form id="profile-form">
        <div class="form-group">
          <label for="p-name">名前(表示名)</label>
          <input type="text" id="p-name" />
        </div>
        <div class="form-group">
          <label>パート(複数選択可)</label>
          <div class="checkbox-row" id="p-parts">
            <label class="checkbox-chip"><input type="checkbox" value="Lead" /> Lead</label>
            <label class="checkbox-chip"><input type="checkbox" value="1st" /> 1st</label>
            <label class="checkbox-chip"><input type="checkbox" value="2nd" /> 2nd</label>
            <label class="checkbox-chip"><input type="checkbox" value="3rd" /> 3rd</label>
            <label class="checkbox-chip"><input type="checkbox" value="Bass" /> Bass</label>
            <label class="checkbox-chip"><input type="checkbox" value="Perc" /> Perc</label>
          </div>
        </div>
        <div class="form-group">
          <label for="p-motivation">バンド参加の意欲</label>
          <select id="p-motivation">
            <option value="">未設定</option>
            <option value="とても参加したい">とても参加したい</option>
            <option value="参加したい">参加したい</option>
            <option value="忙しいけど可能">忙しいけど可能</option>
            <option value="難しい">難しい</option>
          </select>
        </div>
        <div class="form-group form-row">
          <div>
            <label for="p-period">期</label>
            <input type="text" id="p-period" placeholder="例:15" />
          </div>
          <div>
            <label for="p-grade">学年</label>
            <input type="text" id="p-grade" placeholder="例:2年" />
          </div>
        </div>
        <div class="form-group">
          <label for="p-artist">好きなアーティスト</label>
          <input type="text" id="p-artist" placeholder="例:back number" />
        </div>
        <div class="form-group">
          <label for="p-attendance">出席番号</label>
          <input type="text" id="p-attendance" placeholder="例:23" />
        </div>
        <div class="form-group">
          <label for="p-bio">ひとことプロフィール</label>
          <textarea id="p-bio" placeholder="好きなジャンルや、一緒にやりたいことなど"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="profile-save">保存する</button>
        <p class="error-text" id="profile-msg"></p>
      </form>
    </div>

    <div class="card" style="max-width:520px; margin-top:24px; border: 1.5px solid var(--danger);">
      <label style="color:var(--danger);">退会・アカウント削除</label>
      <p class="hint">
        自分の投稿・プロフィールを含む、すべてのデータが完全に削除されます。<br />
        この操作は元に戻せません。
      </p>
      <button type="button" class="btn btn-danger" id="delete-account-btn">退会する(アカウントを削除)</button>
      <p class="error-text" id="delete-account-msg"></p>
    </div>
  </div>

  <script type="module" src="js/profile.js"></script>
</body>
</html>

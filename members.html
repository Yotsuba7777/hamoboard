<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>メンバー紹介 | ハモボード</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav-root"></div>

  <div class="page">
    <div class="page-head">
      <div class="eyebrow">Members</div>
      <h1 class="page-title">メンバー自己紹介</h1>
      <p class="page-sub">気になる人がいたら、掲示板から気軽に声をかけてみましょう。</p>
    </div>

    <div class="section-actions">
      <div class="member-filters">
        <input type="text" id="f-name" placeholder="名前で検索" />
        <select id="f-grade">
          <option value="">学年:すべて</option>
          <option value="B1">B1</option>
          <option value="B2">B2</option>
          <option value="B3">B3</option>
          <option value="B4">B4</option>
          <option value="M1">M1</option>
          <option value="M2">M2</option>
          <option value="M3">M3</option>
          <option value="M4">M4</option>
          <option value="M5">M5</option>
          <option value="M6以上">M6以上</option>
        </select>
        <select id="f-part">
          <option value="">パート:すべて</option>
          <option value="Lead">Lead</option>
          <option value="1st">1st</option>
          <option value="2nd">2nd</option>
          <option value="3rd">3rd</option>
          <option value="Bass">Bass</option>
          <option value="Perc">Perc</option>
        </select>
      </div>
    </div>

    <div id="member-list" class="grid grid-2">
      <p class="loading">読み込み中...</p>
    </div>
  </div>

  <script type="module" src="js/members.js"></script>
</body>
</html>

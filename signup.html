<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>新規登録 | ハモボード</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo">ハモ<span>ボード</span></div>
      <div class="auth-sub">サークルメンバー限定の新規登録です</div>

      <form id="signup-form">
        <div class="form-group">
          <label for="invite">招待コード</label>
          <input type="text" id="invite" required placeholder="サークル内で共有されているコード" />
        </div>
        <div class="form-group">
          <label for="display_name">名前(表示名)</label>
          <input type="text" id="display_name" required placeholder="例:たいよう" />
        </div>
        <div class="form-group">
          <label for="grade">学年</label>
          <input type="text" id="grade" placeholder="例:2年" />
        </div>
        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">パスワード</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password" />
          <p class="hint">6文字以上で設定してください</p>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="signup-btn">登録する</button>
        <p class="error-text" id="error-text"></p>
      </form>

      <div class="auth-switch">
        すでにアカウントをお持ちの方は <a href="login.html">ログイン</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/signup.js"></script>
</body>
</html>

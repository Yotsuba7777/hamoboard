<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>新しいパスワードの設定 | ハモボード</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo">ハモ<span>ボード</span></div>
      <div class="auth-sub">新しいパスワードを設定</div>

      <form id="reset-form">
        <div class="form-group">
          <label for="password">新しいパスワード</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password" />
          <p class="hint">6文字以上で設定してください</p>
        </div>
        <div class="form-group">
          <label for="password2">新しいパスワード(確認)</label>
          <input type="password" id="password2" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="reset-btn">パスワードを変更する</button>
        <p class="error-text" id="error-text"></p>
      </form>
    </div>
  </div>

  <script type="module" src="js/reset-password.js"></script>
</body>
</html>

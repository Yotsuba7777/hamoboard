<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>パスワード再設定 | ハモボード</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo">ハモ<span>ボード</span></div>
      <div class="auth-sub">パスワードをお忘れの方</div>

      <p class="hint" style="margin-bottom:18px;">
        登録したメールアドレスを入力してください。パスワード再設定用のリンクを送ります。
      </p>

      <form id="forgot-form">
        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="forgot-btn">再設定メールを送る</button>
        <p class="error-text" id="error-text"></p>
        <p class="hint" id="success-text" style="color:#3e8f84; display:none;">
          メールを送りました。届いたメールのリンクから新しいパスワードを設定してください(数分待っても届かない場合は、迷惑メールフォルダも確認してください)。
        </p>
      </form>

      <div class="auth-switch">
        <a href="login.html">ログイン画面に戻る</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
